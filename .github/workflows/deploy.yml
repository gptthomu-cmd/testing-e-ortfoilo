name: Build, verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Exposed so the deploy job can tell "nothing to deploy yet" apart from a
    # genuine failure.
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------------
      #  Artwork is deliberately NOT regenerated here.
      #
      #  Everything in public/images, the favicons and the Open Graph cards is
      #  committed to the repository, because that is exactly what was reviewed
      #  in the pull request. Regenerating it during deploy would mean shipping
      #  brand assets that nobody looked at, and that can differ between
      #  ImageMagick builds.
      #
      #  It would also break: ImageMagick is no longer part of the
      #  ubuntu-latest runner image (it shipped on 22.04, not on 24.04), so
      #  `convert` is simply not available. Run `npm run images:build` locally
      #  when masters or OG copy change, and commit the result.
      #
      #  `npm run seo:check` below fails the build if any page references an
      #  image that is missing from the export, so committed assets are still
      #  verified end to end.
      # ---------------------------------------------------------------------

      - name: Type check
        run: npm run typecheck

      - name: Build the static export
        env:
          # Repository name drives the GitHub Pages path prefix.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          # Optional values — set them in Settings → Secrets and variables → Actions → Variables.
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_VERIFICATION }}
        run: npm run build:pages

      - name: SEO and quality gate
        run: npm run seo:check

      - name: Confirm the export is complete
        run: |
          set -euo pipefail
          for file in index.html 404.html sitemap.xml robots.txt feed.xml site.webmanifest favicon.ico apple-touch-icon.png .nojekyll; do
            test -f "out/$file" || { echo "::error::missing out/$file"; exit 1; }
          done
          for file in images/brand/nkt-group-logo-512.png images/brand/site-icon-192.png \
                      images/profile/george-s-thomas-960.jpg images/og/og-default.jpg \
                      images/generated/rack-diagram.svg icons/maskable-512.png; do
            test -f "out/$file" || { echo "::error::missing committed asset out/$file — run 'npm run images:build' locally"; exit 1; }
          done
          echo "image assets: $(find out/images -type f | wc -l) files"
          echo "export looks complete"

      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Enabling Pages for the first time requires repository admin rights,
          # which neither the workflow token nor an app installation token has:
          # POST /repos/{owner}/{repo}/pages returns 403 "Resource not accessible
          # by integration". It is a one-click browser action in
          # Settings → Pages → Source: GitHub Actions.
          #
          # So instead of letting the workflow fail on a configuration state
          # rather than a code problem, detect it: build and verification always
          # run and report, and deployment is skipped with an explicit warning
          # until Pages is switched on.
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled — the export will be deployed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages not enabled::Build and verification passed, but nothing was deployed. Enable Pages once: Settings → Pages → Source: GitHub Actions. The next push to main (or a manual re-run) will then publish the site."
          fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6
        with:
          # Handles the case where Pages exists but is still set to "deploy from
          # a branch" rather than "GitHub Actions".
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # .nojekyll is a dotfile; without this it would be excluded.
          include-hidden-files: true

  deploy:
    needs: build
    # Skipped (not failed) until Pages is enabled, so a green build stays green.
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
