<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img"
     aria-label="Rack diagram showing power, storage, compute and network layers with an off-rack replica">
  <title>Homelab rack layers by failure domain</title>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#5ff0a8"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#0a0a0a"/>
  <g stroke="#161616" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="620"/>
    <line x1="80" y1="0" x2="80" y2="620"/>
    <line x1="120" y1="0" x2="120" y2="620"/>
    <line x1="160" y1="0" x2="160" y2="620"/>
    <line x1="200" y1="0" x2="200" y2="620"/>
    <line x1="240" y1="0" x2="240" y2="620"/>
    <line x1="280" y1="0" x2="280" y2="620"/>
    <line x1="320" y1="0" x2="320" y2="620"/>
    <line x1="360" y1="0" x2="360" y2="620"/>
    <line x1="400" y1="0" x2="400" y2="620"/>
    <line x1="440" y1="0" x2="440" y2="620"/>
    <line x1="480" y1="0" x2="480" y2="620"/>
    <line x1="520" y1="0" x2="520" y2="620"/>
    <line x1="560" y1="0" x2="560" y2="620"/>
    <line x1="600" y1="0" x2="600" y2="620"/>
    <line x1="640" y1="0" x2="640" y2="620"/>
    <line x1="680" y1="0" x2="680" y2="620"/>
    <line x1="720" y1="0" x2="720" y2="620"/>
    <line x1="760" y1="0" x2="760" y2="620"/>
    <line x1="800" y1="0" x2="800" y2="620"/>
    <line x1="840" y1="0" x2="840" y2="620"/>
    <line x1="880" y1="0" x2="880" y2="620"/>
    <line x1="920" y1="0" x2="920" y2="620"/>
    <line x1="960" y1="0" x2="960" y2="620"/>
    <line x1="1000" y1="0" x2="1000" y2="620"/>
    <line x1="1040" y1="0" x2="1040" y2="620"/>
    <line x1="1080" y1="0" x2="1080" y2="620"/>
    <line x1="1120" y1="0" x2="1120" y2="620"/>
    <line x1="1160" y1="0" x2="1160" y2="620"/>
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <text x="48" y="56" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#00f0ff">
    THOMU LAB // RACK LAYERS BY FAILURE DOMAIN
  </text>
  
    <g>
      <rect x="60" y="100" width="700" height="78" rx="10" fill="#101010"
            stroke="#00f0ff" stroke-width="2"/>
      <text x="84" y="132" font-family="DejaVu Sans, Verdana, sans-serif" font-size="19"
            font-weight="700" fill="#e8e4dc">1 · Power</text>
      <text x="84" y="158" font-family="DejaVu Sans Mono, monospace" font-size="14"
            fill="#9d9a93">UPS sized for orderly shutdown · surge protection · tested hookup</text>
    </g>
  
    <g>
      <rect x="60" y="196" width="700" height="78" rx="10" fill="#101010"
            stroke="#00f0ff" stroke-width="2"/>
      <text x="84" y="228" font-family="DejaVu Sans, Verdana, sans-serif" font-size="19"
            font-weight="700" fill="#e8e4dc">2 · Storage</text>
      <text x="84" y="254" font-family="DejaVu Sans Mono, monospace" font-size="14"
            fill="#9d9a93">ZFS pool · ECC RAM · monthly scrub · snapshots before change</text>
    </g>
  
    <g>
      <rect x="60" y="292" width="700" height="78" rx="10" fill="#101010"
            stroke="#1d1d1d" stroke-width="1.5"/>
      <text x="84" y="324" font-family="DejaVu Sans, Verdana, sans-serif" font-size="19"
            font-weight="700" fill="#e8e4dc">3 · Compute</text>
      <text x="84" y="350" font-family="DejaVu Sans Mono, monospace" font-size="14"
            fill="#9d9a93">Edge nodes · telemetry buffers · agent workloads</text>
    </g>
  
    <g>
      <rect x="60" y="388" width="700" height="78" rx="10" fill="#101010"
            stroke="#1d1d1d" stroke-width="1.5"/>
      <text x="84" y="420" font-family="DejaVu Sans, Verdana, sans-serif" font-size="19"
            font-weight="700" fill="#e8e4dc">4 · Network</text>
      <text x="84" y="446" font-family="DejaVu Sans Mono, monospace" font-size="14"
            fill="#9d9a93">Switch · private mesh for remote access · offline-first buffering</text>
    </g>
  
    <g>
      <rect x="60" y="484" width="700" height="78" rx="10" fill="#101010"
            stroke="#1d1d1d" stroke-width="1.5"/>
      <text x="84" y="516" font-family="DejaVu Sans, Verdana, sans-serif" font-size="19"
            font-weight="700" fill="#e8e4dc">5 · Environment</text>
      <text x="84" y="542" font-family="DejaVu Sans Mono, monospace" font-size="14"
            fill="#9d9a93">Temperature and humidity sensing · dry-cabinet for optics</text>
    </g>
  <g>
    <rect x="840" y="196" width="312" height="272" rx="10" fill="#101010" stroke="#1d1d1d" stroke-width="1.5"/>
    <text x="864" y="232" font-family="DejaVu Sans, Verdana, sans-serif" font-size="19" font-weight="700" fill="#e8e4dc">
      Off-rack replica
    </text>
    <text x="864" y="264" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#9d9a93">
      replicated snapshots
    </text>
    <text x="864" y="300" font-family="DejaVu Sans, Verdana, sans-serif" font-size="17" fill="#e8e4dc">
      A pool is not a backup.
    </text>
    <text x="864" y="332" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#6f6c67">
      restore tested quarterly
    </text>
    <text x="864" y="368" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#6f6c67">
      runbook written while healthy
    </text>
    <line x1="760" y1="288" x2="840" y2="288" stroke="#5ff0a8" stroke-width="2" marker-end="url(#arrowhead2)"/>
  </g>
  <text x="48" y="596" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#6f6c67">
    Each layer alarms independently, so a failed PSU is visible before it becomes a dead pool.
  </text>
</svg>
